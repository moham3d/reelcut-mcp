[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reelcut-mcp"
version = "0.1.0"
description = "Token-efficient local video editing pipeline and MCP server for 9:16 Arabic social reels (CPU-friendly)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0.0",
  "faster-whisper>=1.0.0",
  "onnxruntime>=1.17.0",
  "numpy>=1.26.0",
  "pillow>=10.3.0",
  "arabic-reshaper>=3.0.0",
  "python-bidi>=0.4.2",
  "imageio-ffmpeg>=0.5.1",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "typer>=0.12.0",
  "pydantic>=2.7.0",
  "qrcode>=7.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
reelcut = "reelcut.cli:app"
reelcut-mcp = "reelcut.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
